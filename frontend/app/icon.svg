<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Red Gradient for 'E' -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e38" />
      <stop offset="100%" stop-color="#b80710" />
    </linearGradient>

    <!-- Subtle Red Glow -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#e50914" flood-opacity="0.45" />
    </filter>

    <!-- Drop Shadow for Text -->
    <filter id="markShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Deep OLED Black Rounded Background Container (#05070c) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Accents -->
  <rect x="8" y="8" width="496" height="496" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="8" />
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="rgba(229, 9, 20, 0.25)" stroke-width="3" />

  <!-- Branded "EM" Glyph Group -->
  <g font-family="'Segoe UI Black', 'Arial Black', Impact, -apple-system, sans-serif" 
     font-weight="900" 
     font-style="italic" 
     font-size="260"
     filter="url(#markShadow)">
    
    <!-- Red Italic 'E' with glow -->
    <text x="68" y="352" fill="url(#redGrad)" filter="url(#redGlow)" letter-spacing="-12">E</text>

    <!-- White Italic 'M' -->
    <text x="232" y="352" fill="#ffffff" letter-spacing="-8">M</text>
  </g>
</svg>
